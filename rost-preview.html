}header button{font-size:10px;padding:10px 0}.hint{max-width:340px}}#invert[aria-pressed=true]{border-color:#c92c3f;background:#dd192d18;color:#fff}.controls{flex-wrap:wrap}footer{flex-wrap:wrap}.composition-controls{display:flex;gap:20px;align-items:center;margin-bottom:24px;flex-wrap:wrap}select{font:inherit;color:#f5f5f7;background:#222630;border:1px solid #444752;border-radius:5px;padding:10px 30px 10px 12px;max-width:260px}select:focus-visible{outline:2px solid #ed5060;outline-offset:4px}button:disabled{opacity:.45;cursor:wait}.clean .composition-controls,.clean #status{display:none}#status{min-height:18px;color:#b5bac6;font-size:12px;margin:0 0 24px}#status:empty{display:none}#status.error{color:#ff7586}.hint{margin-bottom:12px}@media(max-width:800px){.composition-controls{gap:12px}select{max-width:220px}}

<body>
  <main>
    <header><span class="brand">Р.О.С.Т.</span><span class="caption">ДВИЖЕНИЕ ЛИНИЙ</span><button id="clean" class="quiet">Только паттерн ↗</button></header>
    <nav id="composition-controls" class="composition-controls" aria-label="Композиции" hidden>
      <label>Композиция <select id="composition"></select></label>
    </nav>
    <section class="stage" aria-label="Анимация линейного паттерна"><svg id="pattern" viewBox="0 0 1920 793" role="img" aria-label="Анимация линий"></svg></section>
    <footer>
      <div class="controls"><button id="toggle" aria-pressed="false">Пауза</button><button id="invert" aria-pressed="false">Инверсия: выкл.</button>
        <label>Скорость <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"/><output id="speed-value">1×</output></label>
        <label>Толщина <input id="width" type="range" min="0.25" max="24" step="0.25" value="3"/><output id="width-value">3 px</output></label>
      </div>
      <div class="exports"><button id="svg-static" class="quiet">SVG · кадр ↓</button><button id="svg-motion" class="quiet">SVG · анимация ↓</button><button id="mp4-export">MP4 ↓</button></div>
    </footer>
    <p class="hint"><span id="direction-note"></span> <span id="motion-note"></span></p><p id="status" role="status" aria-live="polite"></p>
  </main>
  <button id="exit-clean" hidden>Вернуть настройки ↙</button>
</body>
